name: mviewer

services:
  mviewer:
    build:
      context: .
      dockerfile: Dockerfile
    image: mviewer/mviewer:develop
    pull_policy: build
    volumes:
      - ./apps:/usr/share/nginx/html/apps:ro

  www:
    image: nginx:1.27-alpine
    ports:
      - "${HTTP_PORT:-8080}:80"
    environment:
      NGINX_HOST: ${NGINX_HOST:-localhost}
    volumes:
      - ./docker/nginx/default.conf.template:/etc/nginx/templates/default.conf.template:ro
      - ./apps:/usr/share/nginx/html/apps:ro
    depends_on:
      - mviewer