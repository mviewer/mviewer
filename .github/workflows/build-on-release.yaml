name: "Build & push docker image on release"

permissions:
  contents: read

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Tag de release à publier
        required: true
        type: string
  release:
    types:
      - published

jobs:
  docker-build:
    timeout-minutes: 5
    runs-on: ubuntu-latest
    steps:
      - name: "Checkout repository with submodules"
        uses: actions/checkout@v4
        with:
          submodules: recursive
          ref: ${{ github.event.inputs.release_tag || github.ref }}
      - name: "Calculating the docker image tag"
        if: github.repository == 'mviewer/mviewer'
        id: version
        env:
          RELEASE_TAG: ${{ github.event.inputs.release_tag || github.event.release.tag_name || github.ref_name }}
        run: |
          DOCKER_TAG="${RELEASE_TAG}"
          echo ::set-output name=VERSION::$DOCKER_TAG

      - name: "build the container"
        if: github.repository == 'mviewer/mviewer'
        run: |
          docker build -t mviewer/mviewer:${{ steps.version.outputs.VERSION }} .

      - name: "Log onto docker hub"
        if: github.repository == 'mviewer/mviewer'
        uses: azure/docker-login@v1
        with:
          username: '${{ secrets.DOCKER_HUB_USERNAME }}'
          password: '${{ secrets.DOCKER_HUB_PASSWORD }}'

      - name: "push the container"
        if: github.repository == 'mviewer/mviewer'
        run: |
          docker push mviewer/mviewer:${{ steps.version.outputs.VERSION }}
