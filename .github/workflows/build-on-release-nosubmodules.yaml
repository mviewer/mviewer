name: "Build & Push Docker image -lite on release"

permissions:
  contents: read

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Tag de release à publier
        required: true
        type: string
  release:
    types:
      - published

jobs:
  docker-build:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: "Checkout repository"
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.release_tag || github.ref }}

      - name: "Determine Docker tag"
        id: version
        if: github.repository == 'mviewer/mviewer'
        env:
          RELEASE_TAG: ${{ github.event.inputs.release_tag || github.event.release.tag_name || github.ref_name }}
        run: |
          DOCKER_TAG="${RELEASE_TAG}"
          echo "VERSION=${DOCKER_TAG}-lite" >> $GITHUB_ENV
          echo "Docker tag will be: ${DOCKER_TAG}-lite"

      - name: "Build Docker image"
        if: github.repository == 'mviewer/mviewer'
        run: |
          docker build -t mviewer/mviewer:${VERSION} .

      - name: "Login to Docker Hub"
        if: github.repository == 'mviewer/mviewer'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_PASSWORD }}

      - name: "Push Docker image"
        if: github.repository == 'mviewer/mviewer'
        run: |
          docker push mviewer/mviewer:${VERSION}